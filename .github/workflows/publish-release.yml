name: Publish verified Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - release-assets/v0.2.0/**
      - .github/workflows/publish-release.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the installer checksum
        working-directory: release-assets/v0.2.0
        run: sha256sum --check --strict M7G-Golden-Voice-AI-Setup-Windows-x64.exe.sha256
      - name: Upload the verified installer and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view v0.2.0 --json tagName,isDraft,url
          gh release upload v0.2.0 \
            release-assets/v0.2.0/M7G-Golden-Voice-AI-Setup-Windows-x64.exe \
            release-assets/v0.2.0/M7G-Golden-Voice-AI-Setup-Windows-x64.exe.sha256 \
            --clobber
          gh release edit v0.2.0 --draft=false --prerelease
          gh release view v0.2.0 --json tagName,isDraft,assets,url
