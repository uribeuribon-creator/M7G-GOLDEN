name: Build and publish M7G ALIEN VOICE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - release-assets/v0.3.0/**
      - .github/workflows/publish-alien-release.yml
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install NSIS
        run: choco install nsis --yes --no-progress
      - name: Build, process audio and verify interface
        shell: pwsh
        run: ./BuildInstaller.ps1
      - name: Test native installation, migration and removal
        shell: pwsh
        run: ./Tests/InstallerSmoke.ps1
      - name: Render the compiled Windows interface
        shell: pwsh
        run: |
          & ./build-windows/Release/AlienUI.exe "$PWD/dist/M7G-ALIEN-VOICE-interface.png"
          if ($LASTEXITCODE -ne 0) { throw "UI render failed: $LASTEXITCODE" }
      - name: Publish verified installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'dist/M7G-ALIEN-VOICE-Setup-Windows-x64.exe'
          $checksum = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower() + '  M7G-ALIEN-VOICE-Setup-Windows-x64.exe'
          Set-Content -Encoding ascii "$exe.sha256" $checksum
          gh release view v0.3.0 --json tagName
          if ($LASTEXITCODE -ne 0) {
            gh release create v0.3.0 --target $env:GITHUB_SHA --draft --prerelease --title 'M7G ALIEN VOICE v0.3.0 — 12 modules / 50 presets' --notes-file release-assets/v0.3.0/RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the draft release' }
          }
          gh release upload v0.3.0 $exe "$exe.sha256" 'dist/M7G-ALIEN-VOICE-interface.png' --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          gh release edit v0.3.0 --draft=false --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
